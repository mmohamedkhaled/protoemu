# Tiny Tapeout project information
project:
  title:        "Protocol emulator with JTAG and SWD"      # Project title
  author:       "Mohamed Khaled"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Two PIO-style programmable state machines that bit-bang UART, SPI, I2C, JTAG, SWD and more, programmed over SPI"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     25000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "6x4"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_mmohamedkhaled_protoemu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"
    - "pe_cfg_spi.v"
    - "pe_core.v"
    - "pe_smslot.v"
    - "pe_sm.v"
    - "pe_decoder.v"
    - "pe_shift.v"
    - "pe_fifo.v"
    - "pe_clkdiv.v"
    - "pe_imem.v"
    - "pe_trigger.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "SCK (config SPI clock)"
  ui[1]: "CSn (config SPI chip select, active low)"
  ui[2]: "MOSI (config SPI data in)"
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "MISO (config SPI data out)"
  uo[1]: "SM0 RX FIFO has data"
  uo[2]: "SM0 TX FIFO has room"
  uo[3]: "SM1 RX FIFO has data"
  uo[4]: "SM1 TX FIFO has room"
  uo[5]: "Trigger pulse"
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins
  uio[0]: "Protocol pin 0"
  uio[1]: "Protocol pin 1"
  uio[2]: "Protocol pin 2"
  uio[3]: "Protocol pin 3"
  uio[4]: "Protocol pin 4"
  uio[5]: "Protocol pin 5"
  uio[6]: "Protocol pin 6"
  uio[7]: "Protocol pin 7"

# Do not change!
yaml_version: 6
